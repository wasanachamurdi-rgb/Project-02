<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HHRA Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F2; --panel:#FFFFFF; --panel-2:#EFEBE4; --line:#DED6C8; --line-soft:#EDE7DC;
  --text:#241C33; --muted:#6B5E77; --muted-2:#9C8FA3; --accent:#7A3FC9; --accent-dim:#EDE1FA;
  --ok:#1F8A4C; --warn:#B8791C; --bad:#C2453C;
  --serif-display:'Fraunces',serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);}
#app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:36px;height:36px;border-radius:8px;background:conic-gradient(from 220deg,#7A3FC9,#C2432B 45%,#B8791C 75%,#1F8A4C 100%);flex-shrink:0;box-shadow:0 0 0 1px var(--line-soft), inset 0 0 12px rgba(0,0,0,.25);}
.brand-text h1{font-family:var(--serif-display);font-size:18px;font-weight:600;margin:0;}
.brand-text p{margin:0;font-size:12px;color:var(--muted);font-family:var(--mono);}
.topbar-actions{display:flex;gap:10px;}
.stepper{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap;}
.step-pill{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 10px;font-size:12.5px;color:var(--muted);}
.step-pill .num{width:22px;height:22px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0;}
.step-pill.active{border-color:var(--accent);color:var(--text);background:rgba(14,156,137,.08);}
.step-pill.active .num{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.step-pill.done{color:var(--text);} .step-pill.done .num{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.step-pill.clickable{cursor:pointer;} .step-pill.clickable:hover{border-color:var(--muted-2);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px;margin-bottom:20px;}
.card h2{font-family:var(--serif-display);font-size:20px;margin:0 0 4px;font-weight:600;}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 22px;max-width:760px;}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical;min-height:64px;font-family:var(--body);}
.btn{border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:10px 18px;font-size:13.5px;font-weight:500;cursor:pointer;}
.btn:hover{border-color:var(--muted-2);} .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn-primary:hover{background:#8B54DA;} .btn-primary:disabled{background:var(--panel-2);border-color:var(--line);color:var(--muted-2);cursor:not-allowed;}
.btn-ghost{background:transparent;} .btn-sm{padding:6px 12px;font-size:12px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap;}
.section-title{font-family:var(--serif-display);font-size:14.5px;font-weight:600;margin:22px 0 12px;color:var(--text);display:flex;align-items:center;gap:8px;}
.section-title:first-child{margin-top:0;} .section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data-table th{text-align:left;font-family:var(--mono);font-weight:500;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.data-table td{padding:7px 10px;border-bottom:1px solid var(--line-soft);}
table.data-table tr.subrow td{color:var(--muted);font-size:11.5px;}
table.data-table tr.totalrow td{font-weight:700;border-top:1px solid var(--line);color:var(--accent);}
.table-wrap{overflow-x:auto;margin-bottom:8px;}
.conc-table input{width:110px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-family:var(--mono);font-size:12px;}
.results-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);}
.rtab{padding:9px 14px;font-size:12.5px;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;cursor:pointer;}
.rtab.active{color:var(--accent);border-bottom-color:var(--accent);} .rtab:hover{color:var(--text);}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
.kpi .kval{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--text);}
.kpi .klabel{font-size:11px;color:var(--muted);margin-top:3px;}
.flag-ok{color:var(--ok)!important;} .flag-warn{color:var(--warn)!important;} .flag-bad{color:var(--bad)!important;font-weight:700;}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:10px;}
@media(max-width:760px){.chart-grid{grid-template-columns:1fr;}}
.chart-box{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px;}
.chart-box h4{margin:0 0 12px;font-size:12.5px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:500;}
.search-results{border:1px solid var(--line);border-radius:8px;margin:10px 0 24px;max-height:280px;overflow-y:auto;}
.search-row{display:flex;align-items:center;gap:14px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft);font-size:13px;}
.search-row:hover{background:var(--panel-2);} .search-row:last-child{border-bottom:none;}
.sr-name{flex:1;} .sr-cas{font-family:var(--mono);font-size:11px;color:var(--muted);}
.tag{font-size:9.5px;font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:4px;color:var(--muted);}
.tag-ca{color:var(--bad);border-color:var(--bad);} .tag-v{color:#2E86C9;border-color:#2E86C9;}
.chem-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.chem-chip{display:flex;align-items:center;gap:8px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:999px;padding:6px 8px 6px 14px;font-size:12.5px;}
.chip-x{background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;width:18px;height:18px;border-radius:50%;}
.chip-x:hover{background:rgba(0,0,0,.08);}
.empty-note{color:var(--muted);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px;}
.notes-cell{font-size:11px;color:var(--muted);max-width:280px;}
.badge{font-size:9.5px;font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);}
.select-native{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235C6C7E'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px !important;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.15);}
@media print{
  body{background:#fff;} #app{max-width:100%;padding:0;} .no-print{display:none!important;}
  .card{background:#fff;border:1px solid #ccc;break-inside:avoid;} table.data-table td,table.data-table th{color:#111;border-color:#ddd;}
  .kpi{background:#f7f7f7;border-color:#ccc;} .chart-box{background:#f7f7f7;border-color:#ccc;}
}
</style>
</head>

  /** Volatilization factor for soil, unlimited-source model (m3/kg). null if not volatile / missing data. */

  function daEventWater(chem, Cw_ugL, tevent) {
    const Kp = num(chem.Kp);
    if (Kp === null || !(tevent > 0)) return null;
    const Cw = Cw_ugL * 1e-3;                       // ug/cm3
    const B = num(chem.B), tau = num(chem.tau), ts = num(chem.tstar);
    if (B === null || tau === null || ts === null) return Kp * Cw * tevent;   // steady-state fallback
    if (tevent <= ts) return 2 * Kp * Cw * Math.sqrt(6 * tau * tevent / Math.PI);
    return Kp * Cw * (tevent / (1 + B) + 2 * tau * ((1 + 3 * B + 3 * B * B) / ((1 + B) * (1 + B))));
  }

  // =================================================================
  //  Exposure factor construction
  // =================================================================
  /** Age segments (yr) for resident lifetime exposure, with ADAF for mutagens. */
  function residentSegments(rc) {
    const c = rc.child, a = rc.adult, segs = [];
    const addSeg = (src, ageFrom, ageTo) => {
      // split each life stage by the mutagenic ADAF age bands
      K.ADAF.forEach(([lo, hi, f]) => {
        const s = Math.max(lo, ageFrom), e = Math.min(hi, ageTo);
        if (e > s) segs.push(Object.assign({}, src, { yrs: e - s, adaf: f }));
      });
    };
    addSeg(c, 0, c.ED);
    addSeg(a, c.ED, c.ED + a.ED);
    return segs;
  }

  /** Lifetime (cancer) exposure factors. mutagen=true weights each age band by its ADAF. */
  function cancerFactors(rec, mutagen) {
    const segs = rec.kind === 'resident'
      ? residentSegments(rec)
      : [Object.assign({}, rec.p, { yrs: rec.p.ED, adaf: 1 })];
    let IFS = 0, DFS = 0, IFW = 0, DFW = 0, EDw = 0, EDsum = 0, teSum = 0, adafED = 0;
    segs.forEach(s => {
      const w = mutagen ? s.adaf : 1;
      IFS += w * s.yrs * s.EF * s.IRS / s.BW;                               // mg soil/kg
      DFS += w * s.yrs * s.EF * s.EV * s.AFs * s.SAs / s.BW;                 // mg soil/kg (dermal)
      IFW += w * s.yrs * s.EF * s.IRW / s.BW;                               // L/kg
      DFW += w * s.yrs * s.EF * s.EV * s.SAw / s.BW;                        // cm2-event/kg
      EDw += w * s.yrs * s.EF;                                              // inhalation: yr x days/yr (ET applied in the EC equation)
      EDsum += s.yrs; teSum += s.yrs * s.tevent;
    });
    const s0 = segs[0];
    return { IFS, DFS, IFW, DFW, INH: EDw, tevent: teSum / EDsum, ET: s0.ET, EDtotal: EDsum };
  }

  /** Non-cancer exposure basis (child for resident receptor). */
  function ncParams(rec) { return rec.kind === 'resident' ? rec.child : rec.p; }

  // =================================================================
  //  Pathway calculations for one chemical
  // =================================================================
  function assessChemical(entry, rec) {
    const chem = entry.chem, res = { chem, pathways: [], notes: [], flags: [] };
    const nc = ncParams(rec), ATnc = nc.ED * 365;
    const mutagen = !!chem.mut && rec.kind === 'resident';
    const F = cancerFactors(rec, mutagen);
    const g = giabsEff(chem);
    const RfDd = chem.rfd != null ? chem.rfd * g : null;      // dermal-adjusted RfD
    const SFd = chem.sfo != null ? chem.sfo / g : null;       // dermal-adjusted slope factor
    const Cs = num(entry.soil), Cw = num(entry.water), Ca = num(entry.air);
    const rba = chem.cas === K.CAS_ARSENIC ? K.RBA_ARSENIC : 1;

    const push = (id, medium, label, o) => res.pathways.push(Object.assign({ id, medium, label, hq: null, risk: null }, o));
    const hasNC_oral = chem.rfd != null, hasCA_oral = chem.sfo != null;
    const hasNC_inh = chem.rfc != null, hasCA_inh = chem.iur != null;

    // ---------------- SOIL ----------------
    if (Cs !== null && Cs >= 0) {
      if (chem.csat != null && Cs > chem.csat) res.flags.push('Soil concentration exceeds the soil saturation limit (Csat = ' + chem.csat + ' mg/kg): free product may be present and volatile-pathway estimates are unreliable.');
      // ingestion
      if (hasNC_oral || hasCA_oral) {
        const add = Cs * rba * 1e-6 * nc.IRS * nc.EF * nc.ED / (nc.BW * ATnc);           // mg/kg-day
        const ladd = Cs * rba * 1e-6 * F.IFS / K.AT_CA;                                   // mg/kg-day
        push('soil_ing', 'Soil', 'Incidental soil ingestion', { doseNC: add, doseCA: ladd,
          hq: hasNC_oral ? add / chem.rfd : null, risk: hasCA_oral ? ladd * chem.sfo : null });
      } else res.notes.push('No oral toxicity value: soil ingestion not evaluated.');
      // dermal
      if (rec.dermalSoil) {
        const abs = num(chem.absd);
        if (abs !== null && (hasNC_oral || hasCA_oral)) {
          const add = Cs * 1e-6 * abs * nc.SAs * nc.AFs * nc.EV * nc.EF * nc.ED / (nc.BW * ATnc);
          const ladd = Cs * 1e-6 * abs * F.DFS / K.AT_CA;
          push('soil_der', 'Soil', 'Dermal contact with soil', { doseNC: add, doseCA: ladd,
            hq: RfDd !== null ? add / RfDd : null, risk: SFd !== null ? ladd * SFd : null });
        } else if (abs === null) res.notes.push('No dermal absorption fraction (ABSd): dermal soil pathway not evaluated (EPA default).');
      }
      // inhalation of vapours + particulates
      if (hasNC_inh || hasCA_inh) {
        const VF = volatilizationFactor(chem);
        const invVF = VF ? 1 / VF : 0;
        if (chem.vol && !VF) res.notes.push('Volatile chemical but missing physicochemical data for VF: only particulate inhalation evaluated.');
        const Cair = Cs * (invVF + 1 / K.PEF);                                            // mg/m3
        const ecNC = Cair * nc.ET * nc.EF * nc.ED / (24 * ATnc);                           // mg/m3
        const ecCA = Cair * F.ET * (F.INH) / (24 * K.AT_CA);                               // mg/m3
        push('soil_inh', 'Soil', 'Inhalation of soil vapours & dust', { doseNC: ecNC, doseCA: ecCA, unitDose: 'mg/m³',
          hq: hasNC_inh ? ecNC / chem.rfc : null, risk: hasCA_inh ? ecCA * 1000 * chem.iur : null, VF });
      }
    }

    // ---------------- TAP WATER (resident receptors only) ----------------
    if (Cw !== null && Cw >= 0) {
      if (!rec.water) {
        res.notes.push('Tap-water pathways are only defined for resident receptors in EPA RSL methodology; water concentration ignored for this receptor.');
      } else {
        if (hasNC_oral || hasCA_oral) {
          const add = Cw * 1e-3 * nc.IRW * nc.EF * nc.ED / (nc.BW * ATnc);
          const ladd = Cw * 1e-3 * F.IFW / K.AT_CA;
          push('wat_ing', 'Tap water', 'Tap-water ingestion', { doseNC: add, doseCA: ladd,
            hq: hasNC_oral ? add / chem.rfd : null, risk: hasCA_oral ? ladd * chem.sfo : null });
        } else res.notes.push('No oral toxicity value: tap-water ingestion not evaluated.');
        // dermal (RAGS Part E)
        const daNC = daEventWater(chem, Cw, nc.tevent);
        const daCA = daEventWater(chem, Cw, F.tevent);
        const lk = num(chem.logKow), mw = num(chem.MW);
        const outsideEPD = lk !== null && mw !== null && (lk > 6 || mw > 700);
        if (daNC !== null && !outsideEPD && (hasNC_oral || hasCA_oral)) {
          const add = daNC * 1e-3 * nc.EV * nc.EF * nc.ED * nc.SAw / (nc.BW * ATnc);      // mg/kg-day
          const ladd = daCA * 1e-3 * F.DFW / K.AT_CA;
          push('wat_der', 'Tap water', 'Dermal contact with tap water', { doseNC: add, doseCA: ladd,
            hq: RfDd !== null ? add / RfDd : null, risk: SFd !== null ? ladd * SFd : null });
        } else if (daNC === null) res.notes.push('No dermal permeability constant (Kp): dermal tap-water pathway not evaluated.');
        else if (outsideEPD) res.notes.push('Chemical falls outside RAGS Part E\'s effective prediction domain for the Kp regression (log Kow > 6 or MW > 700): dermal water pathway not evaluated, per EPA guidance (Section 6.3, RAGS Part E).');
        // inhalation of volatilised water (Andelman)
        if ((hasNC_inh || hasCA_inh) && chem.vol) {
          const Cair = Cw * K.K_ANDELMAN * 1e-3;                                          // mg/m3  (ug/L * L/m3 = ug/m3 -> mg/m3)
          const ecNC = Cair * nc.ET * nc.EF * nc.ED / (24 * ATnc);
          const ecCA = Cair * F.ET * F.INH / (24 * K.AT_CA);
          push('wat_inh', 'Tap water', 'Inhalation of volatilised tap water', { doseNC: ecNC, doseCA: ecCA, unitDose: 'mg/m³',
            hq: hasNC_inh ? ecNC / chem.rfc : null, risk: hasCA_inh ? ecCA * 1000 * chem.iur : null });
        }
      }
    }

    // ---------------- AMBIENT AIR (measured, ug/m3) ----------------
    if (Ca !== null && Ca >= 0) {
      if (hasNC_inh || hasCA_inh) {
        const Cair = Ca * 1e-3;                                                            // mg/m3
        const ecNC = Cair * nc.ET * nc.EF * nc.ED / (24 * ATnc);
        const ecCA = Cair * F.ET * F.INH / (24 * K.AT_CA);
        push('air_inh', 'Air', 'Inhalation of ambient air', { doseNC: ecNC, doseCA: ecCA, unitDose: 'mg/m³',
          hq: hasNC_inh ? ecNC / chem.rfc : null, risk: hasCA_inh ? ecCA * 1000 * chem.iur : null });
      } else res.notes.push('No inhalation toxicity value (RfC/IUR): air pathway not evaluated.');
    }

    // aggregate
    let hi = 0, risk = 0, anyHQ = false, anyRisk = false;
    res.pathways.forEach(p => {
      if (p.hq !== null) { hi += p.hq; anyHQ = true; }
      if (p.risk !== null) { risk += p.risk; anyRisk = true; }
    });
    res.hi = anyHQ ? hi : null;
    res.risk = anyRisk ? risk : null;
    if (!chem.rfd && !chem.rfc) res.notes.push('No reference dose/concentration available: non-cancer hazard cannot be quantified.');
    if (!chem.sfo && !chem.iur) res.notes.push('No slope factor/unit risk available: cancer risk cannot be quantified (not evaluated as a carcinogen).');
    if (chem.mut && rec.kind === 'resident') res.notes.push('Mutagen: early-life exposure weighted with age-dependent adjustment factors (ADAF 10/3/3/1).');
    if (/trichloroethylene/i.test(chem.name) || /^vinyl chloride$/i.test(chem.name))
      res.flags.push('EPA applies a chemical-specific equation for ' + chem.name + ' (early-life / kidney-mutagenicity handling). This tool uses the generic equations, so cancer risk may deviate from EPA RSL values.');
    return res;
  }

  /** Assess a full site: receptor + list of {chem, soil, water, air}. */
  function assess(receptor, entries) {
    const rec = receptor;
    const chems = entries.map(e => assessChemical(e, rec));
    const byPath = {}, tot = { hi: 0, risk: 0 };
    chems.forEach(c => {
      if (c.hi !== null) tot.hi += c.hi;
      if (c.risk !== null) tot.risk += c.risk;
      c.pathways.forEach(p => {
        byPath[p.id] = byPath[p.id] || { id: p.id, label: p.label, medium: p.medium, hq: 0, risk: 0 };
        if (p.hq !== null) byPath[p.id].hq += p.hq;
        if (p.risk !== null) byPath[p.id].risk += p.risk;
      });
    });
    return { chemicals: chems, totals: tot, byPathway: Object.values(byPath) };
  }

  // =================================================================
  //  Validation helper: does the engine reproduce EPA's published RSLs?
  //  Entering an RSL as the concentration must give HI = 1 (non-cancer RSL)
  //  or ELCR = 1e-6 (cancer RSL).
  // =================================================================
  const RSL_SETS = {
    resident_soil: { label: 'Resident soil (mg/kg)',        receptor: 'resident',         medium: 'soil',  val: 'resSoil', key: 'resSoilKey' },
    industrial_soil: { label: 'Industrial soil (mg/kg)',    receptor: 'composite_worker', medium: 'soil',  val: 'indSoil', key: 'indSoilKey' },
    tap_water: { label: 'Resident tap water (µg/L)',        receptor: 'resident',         medium: 'water', val: 'tap',     key: 'tapKey' },
    resident_air: { label: 'Resident air (µg/m³)',          receptor: 'resident',         medium: 'air',   val: 'resAir',  key: 'resAirKey' },
    industrial_air: { label: 'Industrial air (µg/m³)',      receptor: 'composite_worker', medium: 'air',   val: 'indAir',  key: 'indAirKey' }
  };

  function backCheckOne(chem, setId) {
    const S = RSL_SETS[setId], C = chem[S.val], key = chem[S.key] || '';
    if (C == null) return null;
    if (/m/.test(key.replace(/[nc*]/g, '')) ) return { skipped: 'ceiling limit (m) applied by EPA' };
    const entry = { chem }; entry[S.medium] = C;
    const r = assessChemical(entry, RECEPTORS[S.receptor]);
    const kind = key.indexOf('c') === 0 ? 'c' : 'n';
    const got = kind === 'c' ? r.risk : r.hi, target = kind === 'c' ? 1e-6 : 1;
    if (got === null) return { skipped: 'endpoint not computable' };
    return { kind, key, C, got, target, ratio: got / target, flags: r.flags.length > 0 };
  }

  const api = { K, RECEPTORS, RSL_SETS, clone, volatilizationFactor, giabsEff, daEventWater,
                cancerFactors, assessChemical, assess, backCheckOne };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.HHRA = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* HHRA Calculator — UI layer (wizard + results), sits on top of window.HHRA (engine.js) */
(function(){
'use strict';
const H = window.HHRA;
const ALL_CHEMICALS = window.HHRA_CHEMICALS;
const STEP_ORDER = ['id','chemicals','receptor','conc','results'];
const STEP_LABELS = {id:'Site ID', chemicals:'Chemicals of Concern', receptor:'Receptor & Exposure', conc:'Site Concentrations', results:'Results'};

let state = {
  step:'id',
  siteId:'', siteLoc:'', siteNotes:'',
  selected: [],                 // array of CAS
  receptorId: 'resident_adult',
  receptorOverrides: {},        // per-field overrides merged onto preset
  conc: {},                     // cas -> {soil,water,air}
  results: null,
  resultsTab: 'summary',
  chemSearch: '',
  toast: null,
  backcheck: null
};

function chemByCas(cas){ return ALL_CHEMICALS.find(c=>c.cas===cas); }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n,sig=3){
  if(n===null||n===undefined||Number.isNaN(n)) return '—';
  if(n===0) return '0';
  const a=Math.abs(n);
  if(a<0.001||a>=100000) return n.toExponential(sig-1).replace('e+','E+').replace('e-','E-');
  return Number(n.toPrecision(sig)).toString();
}
function currentReceptor(){
  const base = H.clone(H.RECEPTORS[state.receptorId]);
  const ov = state.receptorOverrides[state.receptorId] || {};
  if(base.kind==='resident'){
    base.child = Object.assign({}, base.child, ov.child||{});
    base.adult = Object.assign({}, base.adult, ov.adult||{});
  } else {
    base.p = Object.assign({}, base.p, ov.p||{});
  }
  return base;
}
function maxStepIndex(){
  let i=0;
  if(state.siteId.trim()) i=1;
  if(i>=1 && state.selected.length) i=2;
  if(i>=2) i=3; // receptor always has a default
  if(i>=3 && state.selected.every(cas=>state.conc[cas] && (state.conc[cas].soil!=null||state.conc[cas].water!=null||state.conc[cas].air!=null))) i=4;
  if(i>=4 && state.results) i=5;
  return i;
}
function canGoTo(step){ return STEP_ORDER.indexOf(step) <= maxStepIndex(); }
function goTo(step){ if(canGoTo(step)){ state.step=step; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
window.goTo = goTo;

function showToast(msg){ state.toast=msg; render(); setTimeout(()=>{state.toast=null; render();},2200); }

/* ============================== RENDER ============================== */
function render(){
  const app=document.getElementById('app');
  app.innerHTML = `
    ${renderTopbar()}
    ${renderStepper()}
    <div>${renderStep()}</div>
    ${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}
  `;
  attachHandlers();
}

function renderTopbar(){
  return `<div class="topbar no-print">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <h1>HHRA Calculator</h1>
        <p>RAGS Part A/B/E human health risk assessment · soil · tap water · air</p>
      </div>
    </div>
    <div class="topbar-actions">
      ${state.results?`<button class="btn btn-sm" onclick="window.print()">Print / Save PDF</button>`:''}
      <button class="btn btn-sm btn-ghost" onclick="App.resetAll()">New assessment</button>
    </div>
  </div>`;
}
function renderStepper(){
  const idx=maxStepIndex();
  return `<div class="stepper no-print">
    ${STEP_ORDER.map((s,i)=>{
      const active=state.step===s, done=i<idx&&!active, reach=canGoTo(s);
      return `<div class="step-pill ${active?'active':''} ${done?'done':''} ${reach?'clickable':''}" ${reach?`onclick="goTo('${s}')"`:''}>
        <span class="num">${i+1}</span> ${STEP_LABELS[s]}
      </div>`;
    }).join('')}
  </div>`;
}
function renderStep(){
  switch(state.step){
    case 'id': return stepId();
    case 'chemicals': return stepChemicals();
    case 'receptor': return stepReceptor();
    case 'conc': return stepConc();
    case 'results': return stepResults();
  }
}

/* ---------------- Step 1: Site ID ---------------- */
function stepId(){
  return `<div class="card">
    <h2>Site identification</h2>
    <p class="sub">Name this assessment so you can find it again. Doesn't affect the calculation.</p>
    <div class="field-grid">
      <div class="field"><label>Site name / ID</label>
        <input type="text" id="f-siteid" placeholder="e.g. Former ACME Solvent Recovery Facility" value="${esc(state.siteId)}"></div>
      <div class="field"><label>Location (optional)</label>
        <input type="text" id="f-siteloc" placeholder="City, state" value="${esc(state.siteLoc)}"></div>
      <div class="field" style="grid-column:span 2;"><label>Notes (optional)</label>
        <textarea id="f-sitenotes" placeholder="Scenario, purpose, assumptions...">${esc(state.siteNotes)}</textarea></div>
    </div>
    <div class="row-between">
      <button class="btn btn-primary" id="btn-to-chemicals" ${state.siteId.trim()?'':'disabled'}>Continue to Chemicals of Concern →</button>
    </div>
  </div>`;
}

/* ---------------- Step 2: Chemicals of Concern ---------------- */
function stepChemicals(){
  const q=state.chemSearch.trim().toLowerCase();
  const results = q.length>=2 ? ALL_CHEMICALS.filter(c=>c.name.toLowerCase().includes(q)||c.cas.includes(q)).slice(0,40) : [];
  return `<div class="card">
    <h2>Chemicals of concern</h2>
    <p class="sub">Search EPA's Regional Screening Level database (${ALL_CHEMICALS.length} chemicals) and add every chemical detected at the site. You can add more than one — hazard/risk are summed across all of them.</p>
    <div class="field" style="max-width:520px;">
      <label>Search chemical name or CAS number</label>
      <input type="text" id="chem-search" placeholder="e.g. benzene, arsenic, 71-43-2" value="${esc(state.chemSearch)}" autocomplete="off">
    </div>
    ${results.length? `<div class="search-results">
      ${results.map(c=>`<div class="search-row" onclick="App.addChemical('${c.cas}')">
        <span class="sr-name">${esc(c.name)}</span><span class="sr-cas">${esc(c.cas)}</span>
        <span class="sr-tags">${c.rfd!=null?'<span class="tag">RfD</span>':''}${c.sfo!=null?'<span class="tag tag-ca">CSF</span>':''}${c.iur!=null?'<span class="tag tag-ca">IUR</span>':''}${c.rfc!=null?'<span class="tag">RfC</span>':''}${c.vol?'<span class="tag tag-v">volatile</span>':''}</span>
      </div>`).join('')}
    </div>` : (q.length>=2?'<p class="empty-note">No matches.</p>':'')}

    <div class="section-title"><span class="dot"></span>Selected chemicals (${state.selected.length})</div>
    ${state.selected.length? `<div class="chem-chip-row">
      ${state.selected.map(cas=>{const c=chemByCas(cas); return `<div class="chem-chip">
        <span>${esc(c.name)}</span>
        <button class="chip-x" onclick="App.removeChemical('${cas}')" title="Remove">✕</button>
      </div>`;}).join('')}
    </div>` : `<div class="empty-note">No chemicals added yet — search above and click a result to add it.</div>`}

    <div class="row-between">
      <button class="btn btn-ghost" onclick="goTo('id')">← Back</button>
      <button class="btn btn-primary" id="btn-to-receptor" ${state.selected.length?'':'disabled'}>Continue to Receptor & Exposure →</button>
    </div>
  </div>`;
}

/* ---------------- Step 3: Receptor ---------------- */
function stepReceptor(){
  const rec = currentReceptor();
  const isRes = rec.kind==='resident';
  return `<div class="card">
    <h2>Receptor &amp; exposure scenario</h2>
    <p class="sub">Pick a standard EPA RSL receptor. All exposure factors are pre-filled from EPA defaults and can be overridden.</p>
    <div class="field" style="max-width:480px;margin-bottom:14px;">
      <label>Receptor</label>
      <select id="receptor-select" class="select-native">
        ${Object.keys(H.RECEPTORS).map(id=>`<option value="${id}" ${state.receptorId===id?'selected':''}>${H.RECEPTORS[id].label}</option>`).join('')}
      </select>
    </div>
    <p class="footer-note" style="margin-bottom:18px;">${esc(rec.note)}</p>

    ${isRes ? renderReceptorTable('Child (0–6 yr) — drives non-cancer hazard', rec.child, 'child') +
              renderReceptorTable('Adult — combined with child for lifetime cancer risk', rec.adult, 'adult')
            : renderReceptorTable('Exposure factors', rec.p, 'p')}

    <div class="row-between">
      <button class="btn btn-ghost" onclick="goTo('chemicals')">← Back</button>
      <button class="btn btn-primary" onclick="goTo('conc')">Continue to Site Concentrations →</button>
    </div>
  </div>`;
}
const RECEPTOR_FIELD_META = {
  BW:['Body weight','kg'], IRS:['Soil ingestion rate','mg/day'], IRW:['Tap water ingestion rate','L/day'],
  EF:['Exposure frequency','days/yr'], ED:['Exposure duration','yr'], ET:['Exposure time (air)','hr/day'],
  SAs:['Skin surface area, soil','cm²/day'], AFs:['Soil adherence factor','mg/cm²'],
  SAw:['Skin surface area, water','cm²/event'], tevent:['Event duration, water','hr/event'], EV:['Events','events/day']
};
function renderReceptorTable(title, params, group){
  const keys = Object.keys(RECEPTOR_FIELD_META).filter(k=>params[k]!==undefined);
  return `<div class="section-title"><span class="dot"></span>${esc(title)}</div>
  <div class="field-grid" style="margin-bottom:18px;">
    ${keys.map(k=>{const [label,unit]=RECEPTOR_FIELD_META[k]; return `<div class="field">
      <label>${label} (${unit})</label>
      <input type="number" step="any" data-rec-group="${group}" data-rec-key="${k}" value="${params[k]}">
    </div>`;}).join('')}
  </div>`;
}

/* ---------------- Step 4: Site Concentrations ---------------- */
function stepConc(){
  return `<div class="card">
    <h2>Site concentrations</h2>
    <p class="sub">Enter measured concentrations for each medium present at the site. Leave a field blank if that medium wasn't sampled for a chemical — it will be excluded, not treated as zero.</p>
    <div class="table-wrap"><table class="data-table conc-table">
      <tr><th>Chemical</th><th>Soil (mg/kg)</th><th>Tap water (µg/L)</th><th>Ambient air (µg/m³)</th></tr>
      ${state.selected.map(cas=>{const c=chemByCas(cas); const v=state.conc[cas]||{};
        return `<tr>
          <td>${esc(c.name)}</td>
          <td><input type="number" step="any" data-conc-cas="${cas}" data-conc-medium="soil" value="${v.soil??''}"></td>
          <td><input type="number" step="any" data-conc-cas="${cas}" data-conc-medium="water" value="${v.water??''}"></td>
          <td><input type="number" step="any" data-conc-cas="${cas}" data-conc-medium="air" value="${v.air??''}"></td>
        </tr>`;}).join('')}
    </table></div>
    <div class="row-between">
      <button class="btn btn-ghost" onclick="goTo('receptor')">← Back</button>
      <button class="btn btn-primary" id="btn-compute">Compute results →</button>
    </div>
  </div>`;
}

/* ---------------- Step 5: Results ---------------- */
function stepResults(){
  if(!state.results) return `<div class="empty-note">No results yet.</div>`;
  const R = state.results;
  const tabs=[['summary','Summary'],['chemicals','By Chemical'],['pathways','By Pathway'],['validate','Validate Engine']];
  return `<div class="card">
    <div class="row-between" style="margin-top:0;">
      <div><h2 style="margin-bottom:2px;">${esc(state.siteId)}</h2>
        <p class="sub" style="margin:0;">${esc(H.RECEPTORS[state.receptorId].label)}${state.siteLoc?' · '+esc(state.siteLoc):''}</p></div>
    </div>
    <div class="results-tabs no-print">${tabs.map(([k,l])=>`<button class="rtab ${state.resultsTab===k?'active':''}" onclick="App.setResultsTab('${k}')">${l}</button>`).join('')}</div>
    ${renderResultsTab(state.resultsTab,R)}
    <div class="row-between no-print">
      <button class="btn btn-ghost" onclick="goTo('conc')">← Back to Concentrations</button>
      <button class="btn" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>`;
}
function renderResultsTab(tab,R){
  if(tab==='summary') return summaryTab(R);
  if(tab==='chemicals') return byChemicalTab(R);
  if(tab==='pathways') return byPathwayTab(R);
  if(tab==='validate') return validateTab();
}
function benchmarkClass(kind,v){
  if(v===null) return '';
  if(kind==='hi') return v>=1?'flag-bad':'flag-ok';
  return (v>=1e-6&&v<=1e-4)?'flag-warn':(v>1e-4?'flag-bad':'flag-ok');
}
function summaryTab(R){
  const dom = R.chemicals.slice().filter(c=>c.hi!=null).sort((a,b)=>b.hi-a.hi)[0];
  const domR = R.chemicals.slice().filter(c=>c.risk!=null).sort((a,b)=>b.risk-a.risk)[0];
  return `<div class="kpi-grid">
    <div class="kpi"><div class="kval ${benchmarkClass('hi',R.totals.hi)}">${fmt(R.totals.hi)}</div><div class="klabel">Total Hazard Index (benchmark: &lt; 1)</div></div>
    <div class="kpi"><div class="kval ${benchmarkClass('risk',R.totals.risk)}">${fmt(R.totals.risk)}</div><div class="klabel">Total Excess Cancer Risk (benchmark: 1E-6 – 1E-4)</div></div>
    <div class="kpi"><div class="kval">${dom?esc(dom.chem.name):'—'}</div><div class="klabel">Chemical driving hazard (HI=${dom?fmt(dom.hi):'—'})</div></div>
    <div class="kpi"><div class="kval">${domR?esc(domR.chem.name):'—'}</div><div class="klabel">Chemical driving cancer risk (${domR?fmt(domR.risk):'—'})</div></div>
  </div>
  <div class="chart-grid">
    <div class="chart-box"><h4>Hazard Quotient by chemical</h4>${barChart(R.chemicals.filter(c=>c.hi!=null).map(c=>c.chem.name),R.chemicals.filter(c=>c.hi!=null).map(c=>c.hi))}</div>
    <div class="chart-box"><h4>Cancer risk by chemical</h4>${barChart(R.chemicals.filter(c=>c.risk!=null).map(c=>c.chem.name),R.chemicals.filter(c=>c.risk!=null).map(c=>c.risk))}</div>
  </div>
  <div class="section-title"><span class="dot"></span>Interpretation</div>
  <p class="footer-note" style="max-width:720px;">
    A Hazard Index at or above 1 means the combined non-cancer dose across all chemicals and pathways exceeds levels
    associated with adverse health effects in the reference studies — it does not mean harm is certain, only that further
    evaluation or risk management is warranted. EPA generally considers cancer risk between 1 in 1,000,000 (1×10⁻⁶) and
    1 in 10,000 (1×10⁻⁴) as the risk management range within which site-specific decisions are made; risk above 1×10⁻⁴
    generally warrants action.
  </p>`;
}
function byChemicalTab(R){
  return `<div class="table-wrap"><table class="data-table">
    <tr><th>Chemical</th><th>Hazard Index</th><th>Cancer Risk</th><th>Notes</th></tr>
    ${R.chemicals.map(c=>`<tr>
      <td>${esc(c.chem.name)}</td>
      <td class="${benchmarkClass('hi',c.hi)}">${fmt(c.hi)}</td>
      <td class="${benchmarkClass('risk',c.risk)}">${fmt(c.risk)}</td>
      <td class="notes-cell">${[...c.notes,...c.flags.map(f=>'⚠ '+f)].map(n=>esc(n)).join('<br>')}</td>
    </tr>
    ${c.pathways.map(p=>`<tr class="subrow"><td>&nbsp;&nbsp;${esc(p.label)} <span class="badge">${p.medium}</span></td>
      <td>${fmt(p.hq)}</td><td>${fmt(p.risk)}</td><td></td></tr>`).join('')}
    `).join('')}
  </table></div>`;
}
function byPathwayTab(R){
  return `<div class="table-wrap"><table class="data-table">
    <tr><th>Pathway</th><th>Medium</th><th>Combined HQ</th><th>Combined Risk</th></tr>
    ${R.byPathway.map(p=>`<tr><td>${esc(p.label)}</td><td>${p.medium}</td><td class="${benchmarkClass('hi',p.hq||null)}">${fmt(p.hq)}</td><td class="${benchmarkClass('risk',p.risk||null)}">${fmt(p.risk)}</td></tr>`).join('')}
    <tr class="totalrow"><td>TOTAL</td><td></td><td>${fmt(R.totals.hi)}</td><td>${fmt(R.totals.risk)}</td></tr>
  </table></div>`;
}
function validateTab(){
  if(!state.backcheck) runBackcheck();
  const bc = state.backcheck;
  return `<p class="footer-note" style="margin-bottom:14px;max-width:720px;">
    Sanity check: for every chemical in the database with a published EPA Regional Screening Level, this tool re-enters
    that RSL as the site concentration and confirms it reproduces the defining benchmark (HI ≈ 1 for non-cancer-driven
    RSLs, or cancer risk ≈ 1×10⁻⁶ for cancer-driven RSLs). Disclosed exceptions: EPA's chemical-specific equations for
    vinyl chloride and trichloroethylene are not replicated (flagged per-chemical instead), and dermal water exposure is
    excluded outside RAGS Part E's effective prediction domain (log K<sub>ow</sub> &gt; 6 or MW &gt; 700 g/mol).
  </p>
  <div class="table-wrap"><table class="data-table">
    <tr><th>RSL set</th><th>Chemicals checked</th><th>Within 5%</th><th>Within 25%</th></tr>
    ${bc.map(r=>`<tr><td>${r.label}</td><td>${r.n}</td><td>${r.n?Math.round(100*r.p5/r.n)+'%':'—'}</td><td>${r.n?Math.round(100*r.p25/r.n)+'%':'—'}</td></tr>`).join('')}
  </table></div>`;
}
function runBackcheck(){
  const rows=[];
  Object.keys(H.RSL_SETS).forEach(id=>{
    const S=H.RSL_SETS[id]; let n=0,p5=0,p25=0;
    ALL_CHEMICALS.forEach(c=>{
      const r=H.backCheckOne(c,id);
      if(!r||r.skipped) return;
      n++; const d=Math.abs(r.ratio-1);
      if(d<=0.05) p5++; if(d<=0.25) p25++;
    });
    rows.push({label:S.label,n,p5,p25});
  });
  state.backcheck=rows;
}

/* ---- tiny inline bar chart ---- */
function barChart(labels,values){
  if(!labels.length) return '<p class="empty-note">No data</p>';
  const W=520,H2=220,padL=12,padR=12,padT=10,padB=54;
  const max=Math.max(...values.map(v=>v||0),1e-30);
  const bw=(W-padL-padR)/labels.length;
  const bars=labels.map((lab,i)=>{
    const v=values[i]||0, h=(v/max)*(H2-padT-padB), x=padL+i*bw+bw*0.18, y=H2-padB-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="3" fill="#0E9C89"/>
      <text x="${(x+bw*0.32).toFixed(1)}" y="${H2-padB+14}" text-anchor="end" transform="rotate(-40 ${(x+bw*0.32).toFixed(1)} ${H2-padB+14})" font-size="9.5" fill="#5C6C7E" font-family="monospace">${esc(lab.slice(0,20))}</text>
      <text x="${(x+bw*0.32).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="9" fill="#1C2530" font-family="monospace">${fmt(v,2)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H2}" width="100%" style="max-width:560px;display:block;margin:0 auto;">
    <line x1="${padL}" y1="${H2-padB}" x2="${W-padR}" y2="${H2-padB}" stroke="#D9E0E8"/>${bars}</svg>`;
}

/* ============================== HANDLERS ============================== */
function attachHandlers(){
  const bind=(id,evt,fn)=>{const el=document.getElementById(id); if(el) el.addEventListener(evt,fn);};
  bind('f-siteid','input',e=>{state.siteId=e.target.value; syncStepper();});
  bind('f-siteloc','input',e=>state.siteLoc=e.target.value);
  bind('f-sitenotes','input',e=>state.siteNotes=e.target.value);
  bind('btn-to-chemicals','click',()=>{if(state.siteId.trim()){state.step='chemicals';render();window.scrollTo({top:0,behavior:'smooth'});}});
  bind('chem-search','input',e=>{state.chemSearch=e.target.value; render(); const inp=document.getElementById('chem-search'); if(inp){inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);}});
  bind('btn-to-receptor','click',()=>{if(state.selected.length){state.step='receptor';render();window.scrollTo({top:0,behavior:'smooth'});}});
  bind('receptor-select','change',e=>{state.receptorId=e.target.value; render();});
  document.querySelectorAll('[data-rec-group]').forEach(el=>{
    el.addEventListener('input',e=>{
      const g=el.getAttribute('data-rec-group'), k=el.getAttribute('data-rec-key'), v=parseFloat(el.value);
      state.receptorOverrides[state.receptorId] = state.receptorOverrides[state.receptorId]||{};
      state.receptorOverrides[state.receptorId][g] = state.receptorOverrides[state.receptorId][g]||{};
      state.receptorOverrides[state.receptorId][g][k]=v;
    });
  });
  document.querySelectorAll('[data-conc-cas]').forEach(el=>{
    el.addEventListener('input',e=>{
      const cas=el.getAttribute('data-conc-cas'), m=el.getAttribute('data-conc-medium');
      state.conc[cas]=state.conc[cas]||{};
      state.conc[cas][m] = el.value===''? null : parseFloat(el.value);
    });
  });
  bind('btn-compute','click',doCompute);
}
function syncStepper(){
  const btn=document.getElementById('btn-to-chemicals'); if(btn) btn.disabled=!state.siteId.trim();
  const idx=maxStepIndex();
  document.querySelectorAll('.step-pill').forEach((el,i)=>{
    el.classList.toggle('active', STEP_ORDER[i]===state.step);
    el.classList.toggle('done', i<idx && STEP_ORDER[i]!==state.step);
    el.classList.toggle('clickable', i<=idx);
  });
}
function doCompute(){
  const rec=currentReceptor();
  const entries = state.selected.map(cas=>{
    const chem=chemByCas(cas), c=state.conc[cas]||{};
    return {chem, soil:c.soil??null, water:c.water??null, air:c.air??null};
  });
  try{
    state.results = H.assess(rec, entries);
    state.step='results'; state.resultsTab='summary';
    render(); window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){ console.error(err); showToast('Calculation error — check inputs.'); }
}

const App = {
  addChemical(cas){ if(!state.selected.includes(cas)) state.selected.push(cas); state.chemSearch=''; state.results=null; render(); },
  removeChemical(cas){ state.selected=state.selected.filter(c=>c!==cas); delete state.conc[cas]; state.results=null; render(); },
  setResultsTab(t){ state.resultsTab=t; render(); },
  resetAll(){
    state={step:'id',siteId:'',siteLoc:'',siteNotes:'',selected:[],receptorId:'resident_adult',receptorOverrides:{},conc:{},results:null,resultsTab:'summary',chemSearch:'',toast:null,backcheck:state.backcheck};
    render(); window.scrollTo({top:0,behavior:'smooth'});
  }
};
window.App = App;
render();
})();

</script>
